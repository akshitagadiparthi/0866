<main>
  <header class="page-head">
    <div class="wrap">
      <h1>the menu</h1>

      <p><a class="textlink" href="arrivals.html">see what's on the board now</a></p>

<script>
  const box = document.getElementById("sheets");
  const imgs = window.SITE.menuImages || [];
  box.innerHTML = imgs.length
    ? imgs.map((src, i) => `<img src="${src}" alt="0866° menu, page ${i + 1} of ${imgs.length}" loading="lazy">`).join("")
    : `<div class="photo" style="min-height:70vh">menu page 1 goes here</div><div class="photo" style="min-height:70vh">menu page 2 goes here</div>`;
</script>
